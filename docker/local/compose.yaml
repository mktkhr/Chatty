name: chatty

services:
  postgres_chatty:
    image: postgis/postgis:17-3.5
    container_name: postgres_chatty
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: postgres
      POSTGRES_DB: chatty
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    ports:
      - 6543:5432

volumes:
  postgres-data:
